function findW(w){
 const c=[w,w.replace(/ies$/,'y'),w.replace(/es$/,''),w.replace(/s$/,''),w.replace(/ied$/,'y'),w.replace(/ed$/,''),w.replace(/ed$/,'e'),w.replace(/(.)\1ed$/,'$1'),w.replace(/ing$/,''),w.replace(/ing$/,'e'),w.replace(/(.)\1ing$/,'$1'),w.replace(/er$/,'')];
 for(const x of c){if(x&&DICT[x])return [x,DICT[x]]}
 return null;
}
function wordsIn(t){const seen={},out=[];(String(t).replace(/<[^>]+>/g,' ').toLowerCase().match(/[a-z]+/g)||[]).forEach(w=>{const f=findW(w);if(f&&!seen[f[0]]){seen[f[0]]=1;out.push([w,f[0],f[1]])}});return out}
function hintUI(box,text,before){
 const ws=wordsIn(text);if(!ws.length)return;
 const wrap=document.createElement('div');wrap.className='wd';
 const b=document.createElement('button');b.type='button';b.className='btn sec';b.textContent='📖 단어 뜻 보기';
 const list=document.createElement('div');list.className='wdl';list.hidden=true;
 ws.forEach(([w,x,m])=>{const r=document.createElement('div');const s=document.createElement('b');s.textContent=w===x?w:w+' ('+x+')';r.append(s,' — '+m);list.appendChild(r)});
 b.onclick=()=>{list.hidden=!list.hidden;b.textContent=list.hidden?'📖 단어 뜻 보기':'📖 단어 뜻 닫기'};
 wrap.append(b,list);box.insertBefore(wrap,before||null);
}
const app=document.getElementById('app');
const L=['①','②','③','④'];
let mode='test',cur=0,sel=Q.map(()=>-1),locked=Q.map(()=>false),stuName='';
function el(t,c,x){const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e}
function start(){
 app.innerHTML='';
 const c=el('section','card');c.appendChild(el('h2','','시작하기'));
 c.appendChild(el('p','','교과서와 프린트의 to부정사(목적) 문장으로 만든 4지선다 30문제예요. 방식을 골라 주세요.'));
 const r=el('div','row');
 const a=el('button','btn','✏️ 연습 모드 (풀 때마다 정답과 해설 확인)');a.onclick=()=>begin('practice');
 const b=el('button','btn sec','📋 시험 모드 (끝에서 한꺼번에 채점)');b.onclick=()=>begin('test');
 r.append(a,b);c.appendChild(r);app.appendChild(c);
}
function begin(m){mode=m;cur=0;sel=Q.map(()=>-1);locked=Q.map(()=>false);show()}
function show(){
 window.scrollTo(0,0);app.innerHTML='';
 const q=Q[cur];
 const bar=el('div','bar');const i=el('i');i.style.width=((cur+1)/Q.length*100)+'%';bar.appendChild(i);
 const c=el('section','card');
 const h=el('div','cnt',(cur+1)+' / '+Q.length);h.appendChild(el('span','tag',q[0]));
 c.append(h,el('p','ins',q[1]));
 if(q[2])c.appendChild(el('p','q',q[2]));
 const fb=el('div','fb');fb.setAttribute('aria-live','polite');
 q[3].forEach((t,k)=>{
  const b=el('button','opt',L[k]+' '+t);
  b.onclick=()=>{
   if(locked[cur])return;
   sel[cur]=k;
   if(mode==='practice'){locked[cur]=true;paint();feedback()}else paint();
   nxt.disabled=false;
  };
  c.appendChild(b);
 });
 function paint(){
  c.querySelectorAll('.opt').forEach((b,k)=>{
   b.className='opt';
   if(mode==='practice'&&locked[cur]){if(k===q[4]-1)b.classList.add('good');else if(k===sel[cur])b.classList.add('bad')}
   else if(k===sel[cur])b.classList.add('sel');
  });
 }
 function feedback(){
  const ok=sel[cur]===q[4]-1;fb.className='fb '+(ok?'ok':'no');
  fb.textContent=ok?'정답! 👍':'아쉬워요. 정답은 '+L[q[4]-1]+'번이에요.';
  if(q[5])fb.appendChild(el('div','ex',q[5]));
 }
 hintUI(c,[q[1],q[2],q[3].join(' ')].join(' '));
 c.appendChild(fb);
 const nav=el('div','nav');
 const pv=el('button','btn sec','◀ 이전');pv.disabled=cur===0;pv.onclick=()=>{cur--;show()};
 const nxt=el('button','btn',cur===Q.length-1?'결과 보기 ▶':'다음 ▶');
 nxt.disabled=sel[cur]<0;
 nxt.onclick=()=>{if(cur===Q.length-1)result();else{cur++;show()}};
 nav.append(pv,nxt);
 app.append(bar,c,nav);
 paint();if(mode==='practice'&&locked[cur])feedback();
}
function result(){
 window.scrollTo(0,0);app.innerHTML='';
 const tot=Q.filter((q,k)=>sel[k]===q[4]-1).length;
 const c=el('section','card');c.appendChild(el('h2','','결과 🎓'));
 const lab=el('label','','이름 ');const inp=document.createElement('input');inp.type='text';inp.placeholder='이름을 써 보세요';inp.value=stuName;lab.appendChild(inp);c.appendChild(lab);
 const big=el('p','big');c.appendChild(big);
 const upd=()=>{big.textContent=(stuName?stuName+' 학생, ':'')+tot+' / '+Q.length+'점'};upd();
 inp.oninput=()=>{stuName=inp.value;upd()};
 const g={};Q.forEach((q,k)=>{g[q[0]]=g[q[0]]||[0,0];g[q[0]][1]++;if(sel[k]===q[4]-1)g[q[0]][0]++});
 const t=el('table');Object.keys(g).forEach(n=>{const r=el('tr');r.append(el('td','',n),el('td','',g[n][0]+' / '+g[n][1]));t.appendChild(r)});c.appendChild(t);
 const wrong=Q.map((q,k)=>k).filter(k=>sel[k]!==Q[k][4]-1);
 c.appendChild(el('h2','',wrong.length?'틀린 문제 다시 보기':'모두 맞혔어요! 🎉'));
 wrong.forEach(k=>{
  const q=Q[k],d=el('div','wr');
  d.appendChild(el('div','cnt',(k+1)+'번 · '+q[0]));
  d.appendChild(el('div','ins',q[1]));if(q[2])d.appendChild(el('div','',q[2]));
  d.appendChild(el('div','',(sel[k]>=0?'내 답: '+L[sel[k]]+' ':'')+' 정답: '+L[q[4]-1]+' '+q[3][q[4]-1]));
  if(q[5])d.appendChild(el('div','ex',q[5]));
  c.appendChild(d);
 });
 const r=el('div','row noprint');
 const a=el('button','btn sec','처음으로');a.onclick=start;
 const p=el('button','btn','인쇄하기');p.onclick=()=>window.print();
 r.append(a,p);c.appendChild(r);app.appendChild(c);
}
start();
</script>
</body>
</html>
